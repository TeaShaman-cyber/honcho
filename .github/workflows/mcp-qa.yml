name: MCP QA

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-qa.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject whitespace errors
        run: git diff --check

      - name: Run deterministic MCP QA
        run: docker build --target qa --tag honcho-mcp-qa:${{ github.sha }} mcp

      - name: Build production MCP image
        run: docker build --tag honcho-mcp:${{ github.sha }} mcp


  worker-bundle:
    # TypeScript typecheck does not prove that the Cloudflare Worker entry
    # actually bundles after the MCP SDK v1 -> v2 migration.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install exact Bun lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Compile Cloudflare Worker without publishing
        working-directory: mcp
        run: bunx wrangler deploy --dry-run --outdir /tmp/honcho-mcp-worker-bundle
