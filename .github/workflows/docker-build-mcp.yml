name: Build and Push MCP Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - ".github/workflows/docker-build-mcp.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mcp/**"
      - ".github/workflows/docker-build-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Never publish from feature-branch manual dispatches.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.3.0
        with:
          platforms: linux/amd64, linux/arm64
      - name: Resolve lowercase MCP package name
        id: image
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/honcho-mcp" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build MCP image (publish only after main promotion)
        id: build
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./mcp
          file: ./mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest published MCP image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1.1.2
        with:
          subject-name: ${{ steps.image.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
